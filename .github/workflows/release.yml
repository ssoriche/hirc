name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  LINUX_DEPS: libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-dev libx11-xcb-dev libxcb1-dev libxi-dev libxcursor-dev libxrandr-dev libfontconfig-dev libfreetype-dev libzstd-dev clang pkg-config

jobs:
  version:
    name: Tag a version
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # semantic-release reads the Conventional Commits since the last tag:
      #   fix: -> patch, feat: -> minor, "!" or a BREAKING CHANGE footer -> major.
      # When a release is due it stamps Cargo.toml and Cargo.lock
      # (scripts/set-version.sh), commits that, tags vX.Y.Z and opens a draft
      # release, which `publish` makes public once the builds are attached.
      - name: release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npx --yes -p semantic-release@25 -p @semantic-release/exec@7 -p @semantic-release/git@10 semantic-release

  macos:
    name: macOS app (Apple Silicon)
    runs-on: macos-latest
    needs: version
    if: needs.version.outputs.version != ''
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ env.VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and bundle the app
        run: CARGO=cargo scripts/bundle-macos.sh --no-install
      - name: Package
        run: |
          ditto -c -k --keepParent target/release/hirc.app "hirc-$VERSION-macos.zip"
          shasum -a 256 "hirc-$VERSION-macos.zip" > "hirc-$VERSION-macos.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: hirc-*-macos.zip*

  linux:
    name: Linux binary (x86_64)
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.version != ''
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ env.VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ env.LINUX_DEPS }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p hirc
      - name: Package
        run: |
          dir="hirc-$VERSION-linux-x86_64"
          mkdir "$dir"
          cp target/release/hirc README.md LICENSE "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: hirc-*-linux-x86_64.tar.gz*

  publish:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: [version, macos, linux]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Attach the files
        run: gh release upload "$TAG" hirc-* --clobber -R "$GITHUB_REPOSITORY"
      - name: Publish
        run: gh release edit "$TAG" --draft=false --latest -R "$GITHUB_REPOSITORY"
