name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # gpui's system libraries on Ubuntu; README's list matches.
  LINUX_DEPS: libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-dev libx11-xcb-dev libxcb1-dev libxi-dev libxcursor-dev libxrandr-dev libfontconfig-dev libfreetype-dev libzstd-dev clang pkg-config

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: gpui's system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ env.LINUX_DEPS }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features hirc/snapshot,hirc-core/ergo-tests,hirc-core/bouncer-tests -- -D warnings

  test:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: gpui's system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ env.LINUX_DEPS }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p hirc
      - name: Bundle the macOS app
        if: runner.os == 'macOS'
        run: CARGO=cargo scripts/bundle-macos.sh --no-install

  ergo:
    # The bouncer suites need ZNC 1.10.3 with its playback module and soju
    # 0.11.1, which hirc's flox environment pins for Apple Silicon.
    name: Ergo and bouncer suites
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: flox/install-flox-action@v2
      - uses: Swatinem/rust-cache@v2
      - run: flox activate -- scripts/ergo-test.sh setup
      - run: flox activate -- cargo test -p hirc-core --features ergo-tests --test ergo --test reconnect
      - run: flox activate -- cargo test -p hirc-core --features bouncer-tests --test bouncer --test reconnect_bouncer

  nix:
    name: Nix package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix flake check --no-build
      - run: nix build --print-build-logs
      - run: test -x result/bin/hirc
      - if: runner.os == 'macOS'
        run: test -x result/Applications/hirc.app/Contents/MacOS/hirc
