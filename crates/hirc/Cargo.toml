[package]
name = "hirc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A native IRC client for Ergo"

[dependencies]
hirc-core = { path = "../hirc-core" }
chrono.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation.workspace = true

[features]
# Developer-only: scripted, network-free UI runs with window screenshots.
# See src/snapshot.rs. Nothing here is built without the feature.
# `gpui/test-support` gives the headless context and `Window::render_to_image`
# for HIRC_OFFSCREEN; it is never enabled in the default build.
snapshot = ["dep:toml", "dep:serde", "dep:raw-window-handle", "dep:objc", "dep:image", "gpui/test-support", "gpui_platform/test-support"]

[dependencies.toml]
workspace = true
optional = true

[dependencies.serde]
workspace = true
optional = true

[dependencies.image]
version = "0.25"
default-features = false
features = ["png"]
optional = true

[dependencies.raw-window-handle]
version = "=0.6.2"
optional = true

[target.'cfg(target_os = "macos")'.dependencies.objc]
version = "=0.2.7"
optional = true

# objc 0.2's msg_send! probes `feature = "cargo-clippy"` in our crate.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
