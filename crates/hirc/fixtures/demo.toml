  ":bob!b@h PRIVMSG #general :line 12 of a long scrolling run",
  ":bob!b@h PRIVMSG #general :line 13 of a long scrolling run",
  ":bob!b@h PRIVMSG #general :line 14 of a long scrolling run",
  ":bob!b@h PRIVMSG #general :line 15 of a long scrolling run",
  ":bob!b@h PRIVMSG #general :line 16 of a long scrolling run",
