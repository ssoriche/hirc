[workspace]
resolver = "3"
members = ["crates/hirc-core", "crates/hirc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
indexmap = { version = "2", features = ["serde"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-segmentation = "1.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Optimize dependencies even in debug builds; gpui is very slow unoptimized.
# Our own code stays quick to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
